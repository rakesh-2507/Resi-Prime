<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESI_PRIME ADMIN PANEL</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #252a34;
            overflow: hidden;
            position: relative;
        }

        /* TOP WAVE */
        .top-wave {
            position: absolute;
            top: 0;
            width: 100%;
            height: 180px;
            background: #61676b;
            border-bottom-left-radius: 50% 20%;
            border-bottom-right-radius: 50% 20%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-wave h1 {
            color: white;
            font-size: 32px;
            letter-spacing: 2px;
        }

        /* BOTTOM WAVE */
        .bottom-wave {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: #61676b;
            border-top-left-radius: 50% 20%;
            border-top-right-radius: 50% 20%;
        }

        .login-card {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            z-index: 10;
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #252a34;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #61676b;
            box-shadow: 0 0 0 3px rgba(97, 103, 107, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 15px;
            cursor: pointer;
            color: #777;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: #61676b;
            color: white;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #4e5457;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .extra-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
        }

        .extra-buttons button {
            border: none;
            background: none;
            color: #61676b;
            cursor: pointer;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #ff4d4f;
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.4s ease;
            z-index: 999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .success {
            background: #28a745 !important;
        }
    </style>
</head>

<body>

    <!-- TOP -->
    <div class="top-wave">
    </div>

    <!-- LOGIN CARD -->
    <div class="login-card">
        <div class="d-flex justify-content-center">
            <img src="/assets/web_logo.png" width="25%" alt="Resi_Prime Logo">
        </div>
        <div class="form-group">
            <label>Email</label>
            <div class="input-box">
                <input type="email" id="email" placeholder="Enter your email">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-box">
                <input type="password" id="password" placeholder="********">
                <i class="fa-solid fa-eye toggle-password" id="eye"></i>
            </div>
        </div>

        <button class="login-btn" id="loginBtn">
            Login
        </button>

        <div class="extra-buttons">
            <button id="forgotBtn">Forgot Password</button>
            <button onclick="window.location.href='/register.html'">
                Register
            </button>
        </div>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-wave"></div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- FIREBASE LOGIN -->
    <script type="module">
        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {

            if (!user) return;

            try {

                const userDoc =
                    await getDoc(doc(db, "users", user.uid));

                if (!userDoc.exists()) return;

                const userData = userDoc.data();

                if (
                    user.emailVerified &&
                    userData.role === "Admin" &&
                    userData.status === "approved"
                ) {

                    window.location.href =
                        "/dashboard.html";
                }

            } catch (e) {

                console.log(e);
            }
        });
        import { auth, db } from "./firebase-config.js";

        import {
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // ELEMENTS
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const forgotBtn = document.getElementById("forgotBtn");

        // TOAST
        function showToast(message, success = false) {

            const toast = document.getElementById("toast");

            toast.innerText = message;

            toast.classList.add("show");

            if (success) {
                toast.classList.add("success");
            } else {
                toast.classList.remove("success");
            }

            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // LOGIN
        loginBtn.addEventListener("click", async () => {

            const userEmail = email.value.trim();
            const userPassword = password.value.trim();

            if (!userEmail || !userPassword) {
                showToast("Please enter email & password");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = "Please wait...";

            try {

                // FIREBASE LOGIN
                const userCredential = await signInWithEmailAndPassword(
                    auth,
                    userEmail,
                    userPassword
                );

                const user = userCredential.user;
                if (!user.emailVerified) {

                    showToast("Please verify your email first");

                    await signOut(auth);

                    return;
                }

                console.log("✅ Login Success:", user);

                // CHECK USER ROLE FROM FIRESTORE

                const userDoc = await getDoc(doc(db, "users", user.uid));

                if (!userDoc.exists()) {

                    showToast("User data not found");

                    await signOut(auth);

                    return;
                }

                const userData = userDoc.data();

                console.log(userData);

                // ALLOW ONLY ADMIN
                if (userData.role !== "Admin") {

                    showToast("Access denied. Admin only.");

                    await signOut(auth);

                    return;
                }

                // OPTIONAL STATUS CHECK
                if (userData.status !== "approved") {

                    showToast("Contact Existing Admin for Access");

                    await signOut(auth);

                    return;
                }

                showToast("Login Successful", true);

                // SAVE SESSION
                localStorage.setItem("adminLoggedIn", "true");

                // REDIRECT
                setTimeout(() => {
                    window.location.href = "/dashboard.html";
                }, 1000);

            } catch (error) {

                console.log(error);

                let message = "Login failed";

                if (error.code === "auth/wrong-password") {
                    message = "Incorrect password";
                }

                else if (error.code === "auth/user-not-found") {
                    message = "Account not found";
                }

                else if (error.code === "auth/invalid-email") {
                    message = "Invalid email address";
                }

                else if (error.code === "auth/network-request-failed") {
                    message = "No internet connection";
                }

                else if (error.code === "auth/invalid-credential") {
                    message = "Invalid email or password";
                }

                showToast(message);
            }

            finally {

                loginBtn.disabled = false;
                loginBtn.innerHTML = "Login";
            }

        });

        // FORGOT PASSWORD
        forgotBtn.addEventListener("click", async () => {

            const userEmail = email.value.trim();

            if (!userEmail) {
                showToast("Enter your email first");
                return;
            }

            try {

                await sendPasswordResetEmail(auth, userEmail);

                showToast("Password reset email sent", true);

            } catch (error) {

                console.log(error);

                showToast("Failed to send reset email");
            }
        });

        // SHOW/HIDE PASSWORD
        const eye = document.getElementById("eye");

        eye.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";

                eye.classList.remove("fa-eye");

                eye.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                eye.classList.remove("fa-eye-slash");

                eye.classList.add("fa-eye");
            }
        });

    </script>
</body>

</html>

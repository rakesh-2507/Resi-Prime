<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Visitor Logs</title>
    <script type="module" src="/auth-guard.js"></script>
    <style>
        h1 {
            margin-bottom: 20px;
        }

        #logsContainer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .visitor-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .info {
            flex: 1;
        }

        .info h3 {
            margin-bottom: 8px;
        }

        .info p {
            margin: 4px 0;
            color: #555;
        }

        .badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .active {
            background: #dff5e3;
            color: green;
        }

        .used {
            background: #ff8c00;
            color: #000000;
        }

        .expired {
            background: #ff0000;
            color: rgb(255, 255, 255);
        }

        .unknown {
            background: #eee;
            color: #555;
        }

        .loading,
        .empty {
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
        }
    </style>

</head>

<body style="background: #f4f7fe">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none; color: inherit">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard.html">
                    <i class="fa-solid fa-home"></i>
                    Home
                </a>
            </li>
            <li>
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li>
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li>
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo" />
            </a>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>Visitor Logs</h1>

            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>
        </div>

        <div id="logsContainer" class="card_container">Loading...</div>
    </main>
    <script type="module">

        import { db } from "/firebase-config.js";

        import {
            collection,
            query,
            orderBy,
            onSnapshot,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const container = document.getElementById("logsContainer");

        const q = query(
            collection(db, "visitor_passes")
        );

        onSnapshot(q, async (snapshot) => {

            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML =
                    `<div class="empty">No visitor logs</div>`;
                return;
            }

            for (const documentData of snapshot.docs) {

                const data = documentData.data();

                let resident = {
                    name: "Unknown",
                    flat: "-"
                };

                try {

                    if (data.residentId) {

                        const residentDoc = await getDoc(
                            doc(db, "users", data.residentId)
                        );

                        if (residentDoc.exists()) {
                            resident = residentDoc.data();
                        }
                    }

                } catch (e) {
                    console.log(e);
                }

                const validatedAt =
                    data.validatedAt?.toDate
                        ? data.validatedAt.toDate()
                        : null;

                const badgeClass =
                    data.status || "unknown";

                const card = document.createElement("div");

                card.className = "visitor-card";

                card.innerHTML = `

        <div class="info">

            <h3>${data.visitorName || "Visitor"}</h3>

            <p><strong>Mobile:</strong>
            ${data.visitorMobile || "--"}</p>

            <p><strong>Purpose:</strong>
            ${data.purpose || "--"}</p>

            <p>
            <strong>Date:</strong>
            ${data.visitDate || "--"}
            |
            ${data.startTime || "--"}
            -
            ${data.endTime || "--"}
            </p>

            <p>
            <strong>Resident:</strong>
            ${resident.name}
            (${resident.flat})
            </p>

            ${validatedAt
                        ?
                        `<p>
                <strong>Validated:</strong>
                ${validatedAt.toLocaleString()}
                </p>`
                        :
                        ""
                    }

        </div>

       <div class="badge ${badgeClass}">
            ${data.status === "used"
                        ? "SCANNED"
                        : (data.status || "unknown").toUpperCase()}
        </div>

        `;

                container.appendChild(card);
            }

        });

    </script>
    <script type="module" src="/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amenities Bookings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/auth-guard.js"></script>
    <style>
        .staff-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
    </style>
</head>

<body style="background: #f4f7fe">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none; color: inherit">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard.html">
                    <i class="fa-solid fa-home"></i>
                    Home
                </a>
            </li>
            <li>
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li>
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li class="active">
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo" />
            </a>
        </div>
    </aside>

    <main class="main">

        <div class="topbar">
            <h1>Staff Management</h1>
            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>
        </div>
        <div class="card p-4 mb-4">

            <h4 id="formTitle">Add Staff</h4>

            <input id="name" class="form-control mb-3" placeholder="Full Name">

            <input id="email" class="form-control mb-3" placeholder="Email">

            <input id="phone" class="form-control mb-3" placeholder="Phone Number">

            <input id="alternatePhone" class="form-control mb-3" placeholder="Alternate Phone">

            <input id="aadhar" class="form-control mb-3" placeholder="Aadhar Number">

            <input id="dob" class="form-control mb-3" type="date">

            <select id="workType" class="form-select mb-3">

                <option>Plumber</option>
                <option>Electrician</option>
                <option>Carpenter</option>
                <option>Cleaner</option>
                <option>Security</option>
                <option>Other</option>

            </select>

            <div class="row">

                <div class="col">

                    <label>Shift Start</label>

                    <input id="shiftStart" type="time" class="form-control">

                </div>

                <div class="col">

                    <label>Shift End</label>

                    <input id="shiftEnd" type="time" class="form-control">

                </div>

            </div>

            <textarea id="address" rows="3" class="form-control mt-3" placeholder="Address"></textarea>

            <button class="btn btn-primary mt-3" onclick="saveStaff()">

                Save Staff

            </button>

        </div>
        <div id="staffContainer" class="card_container">

            Loading...

        </div>
    </main>
    <script type="module">

        import { db }
            from "/firebase-config.js";

        import {

            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            orderBy,
            onSnapshot,
            Timestamp

        }

            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


        const staffContainer =
            document.getElementById(
                "staffContainer"
            );

        let editingId = null;


        /* ---------- SAVE ---------- */

        window.saveStaff =
            async () => {

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const altPhone =
                    document.getElementById("alternatePhone").value.trim();

                const aadhar =
                    document.getElementById("aadhar").value.trim();

                const dob =
                    document.getElementById("dob").value;

                const shiftStart =
                    document.getElementById("shiftStart").value;

                const shiftEnd =
                    document.getElementById("shiftEnd").value;

                const workType =
                    document.getElementById("workType").value;

                const address =
                    document.getElementById("address").value.trim();

                if (

                    !name ||
                    !email ||
                    !phone ||
                    !aadhar ||
                    !dob ||
                    !shiftStart ||
                    !shiftEnd ||
                    !address

                ) {

                    alert(
                        "Fill all fields"
                    );

                    return;

                }

                const data = {

                    name,
                    email,
                    phone,

                    alternatePhone:
                        altPhone,

                    aadharNumber:
                        aadhar,

                    workType,

                    dob:
                        Timestamp.fromDate(
                            new Date(dob)
                        ),

                    shiftStart:
                        Timestamp.fromDate(
                            new Date(
                                `1970-01-01T${shiftStart}`
                            )
                        ),

                    shiftEnd:
                        Timestamp.fromDate(
                            new Date(
                                `1970-01-01T${shiftEnd}`
                            )
                        ),

                    address,

                    isActive: true

                };

                try {

                    if (editingId) {

                        await updateDoc(

                            doc(
                                db,
                                "staff",
                                editingId
                            ),

                            data

                        );

                        alert(
                            "Updated"
                        );

                    }

                    else {

                        const ref =
                            await addDoc(

                                collection(
                                    db,
                                    "staff"
                                ),

                                {

                                    ...data,

                                    createdAt:
                                        Timestamp.now()

                                }

                            );

                        await updateDoc(

                            doc(
                                db,
                                "staff",
                                ref.id
                            ),

                            {
                                staffId:
                                    ref.id
                            }

                        );

                        alert(
                            "Added"
                        );

                    }

                    resetForm();

                }

                catch (err) {

                    alert(
                        err.message
                    );

                }

            };



        /* ---------- RESET ---------- */

        function resetForm() {

            editingId = null;

            document
                .getElementById(
                    "formTitle"
                )

                .innerText =
                "Add Staff";

            [
                "name",
                "email",
                "phone",
                "alternatePhone",
                "aadhar",
                "dob",
                "shiftStart",
                "shiftEnd",
                "address"
            ]

                .forEach(id => {

                    document
                        .getElementById(id)
                        .value = "";

                });

            document
                .getElementById(
                    "workType"
                )

                .value =
                "Plumber";

        }



        /* ---------- LOAD ---------- */

        function loadStaff() {

            const q =
                query(

                    collection(
                        db,
                        "staff"
                    ),

                    orderBy(
                        "createdAt",
                        "desc"
                    )

                );

            onSnapshot(

                q,

                (snapshot) => {

                    staffContainer.innerHTML = "";

                    if (snapshot.empty) {

                        staffContainer.innerHTML =

                            "No staff found";

                        return;

                    }

                    snapshot.forEach(

                        (docSnap) => {

                            const data =
                                docSnap.data();

                            const card =
                                document.createElement(
                                    "div"
                                );

                            card.className =
                                "staff-card mb-3";

                            card.innerHTML = `

<div class="d-flex justify-content-between">

<div>

<h5>

${data.name}

</h5>

<p>

${data.workType}

</p>

<p>

${data.phone}

</p>

<span class="badge bg-${data.isActive
                                    ? "success"
                                    : "secondary"
                                }">

${data.isActive
                                    ? "Active"
                                    : "Inactive"
                                }

</span>

</div>

<div class="action-btns">

<button
class="btn btn-primary btn-sm editBtn">

Edit

</button>

<button
class="btn btn-danger btn-sm deleteBtn">

Delete

</button>

<div class="form-check form-switch">

<input
class="form-check-input activeSwitch"
type="checkbox"
${data.isActive ? "checked" : ""}>

</div>

</div>

</div>

`;



                            card

                                .querySelector(
                                    ".editBtn"
                                )

                                .onclick = () => {

                                    editingId =
                                        docSnap.id;

                                    document
                                        .getElementById(
                                            "formTitle"
                                        )

                                        .innerText =
                                        "Edit Staff";

                                    document.getElementById("name").value =
                                        data.name;

                                    document.getElementById("email").value =
                                        data.email;

                                    document.getElementById("phone").value =
                                        data.phone;

                                    document.getElementById("alternatePhone").value =
                                        data.alternatePhone || "";

                                    document.getElementById("aadhar").value =
                                        data.aadharNumber;

                                    document.getElementById("workType").value =
                                        data.workType;

                                    document.getElementById("address").value =
                                        data.address;

                                    document.getElementById("dob").value =
                                        data.dob.toDate()
                                            .toISOString()
                                            .split("T")[0];

                                    document.getElementById("shiftStart").value =
                                        data.shiftStart.toDate()
                                            .toTimeString()
                                            .slice(0, 5);

                                    document.getElementById("shiftEnd").value =
                                        data.shiftEnd.toDate()
                                            .toTimeString()
                                            .slice(0, 5);

                                    window.scrollTo({

                                        top: 0,
                                        behavior: "smooth"

                                    });

                                };



                            card

                                .querySelector(
                                    ".deleteBtn"
                                )

                                .onclick =
                                async () => {

                                    if (

                                        !confirm(
                                            "Delete Staff?"
                                        )

                                    ) return;

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "staff",
                                            docSnap.id
                                        )

                                    );

                                };



                            card

                                .querySelector(
                                    ".activeSwitch"
                                )

                                .onchange =
                                async (e) => {

                                    await updateDoc(

                                        doc(
                                            db,
                                            "staff",
                                            docSnap.id
                                        ),

                                        {

                                            isActive:
                                                e.target.checked

                                        }

                                    );

                                };

                            staffContainer
                                .appendChild(
                                    card
                                );

                        });

                }

            );

        }

        loadStaff();

    </script>
    <script type="module" src="/script.js"></script>

</body>

</html>

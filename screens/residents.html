<!doctype html>
<html>

<head>
    <title>Residents Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/auth-guard.js"></script>
    <style>
        .resident-card {

            border-radius: 12px;
            background: white;

        }

        .profile-image {

            width: 100px;
            height: 100px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #eee;

        }

        .info-section {

            flex: 1;

        }

        .image-section {

            min-width: 120px;

            display: flex;

            justify-content: center;

            align-items: flex-start;

        }
    </style>
</head>

<body style="background: #f4f7fe">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none; color: inherit">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard.html">
                    <i class="fa-solid fa-home"></i>
                    Home
                </a>
            </li>
            <li>
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li class="active">
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li>
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo" />
            </a>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>Residents Management</h1>

            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>
        </div>

        <div id="residentContainer">
            Loading residents...
        </div>
    </main>
    <script type="module">

        import { db } from "../firebase-config.js";

        import {
            collection,
            query,
            where,
            orderBy,
            onSnapshot,
            doc,
            updateDoc
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const residentContainer =
            document.getElementById(
                "residentContainer"
            );

        const STATUS_APPROVED =
            "approved";

        const STATUS_REJECTED =
            "rejected";

        const STATUS_PENDING =
            "pending";

        function getStatusBadge(
            status
        ) {

            if (
                status ===
                STATUS_APPROVED
            ) {

                return `
        <span class="
        badge bg-success">

        Approved

        </span>
        `;

            }

            if (
                status ===
                STATUS_REJECTED
            ) {

                return `
        <span class="
        badge bg-danger">

        Rejected

        </span>
        `;

            }

            return `

    <span class="
    badge bg-warning
    text-dark">

    Pending

    </span>

    `;

        }

        async function updateStatus(
            userId,
            status
        ) {

            try {

                await updateDoc(

                    doc(
                        db,
                        "users",
                        userId
                    ),

                    {
                        status
                    }

                );

                alert(
                    `User updated to ${status}`
                );

            }

            catch (err) {

                console.log(err);

                alert(
                    "Update failed"
                );

            }

        }

        window.changeResidentStatus =
            function (
                userId,
                status,
                name
            ) {

                const confirmAction =
                    confirm(

                        `Are you sure you want to ${status} ${name}?`

                    );

                if (
                    !confirmAction
                ) {

                    return;

                }

                updateStatus(
                    userId,
                    status
                );

            };

        function loadResidents() {

            const q = query(

                collection(
                    db,
                    "users"
                ),

                where(
                    "role",
                    "==",
                    "Resident"
                ),

                orderBy(
                    "status"
                ),

                orderBy(
                    "apartment"
                ),

                orderBy(
                    "flat"
                )

            );

            onSnapshot(

                q,

                (snapshot) => {

                    residentContainer
                        .innerHTML = "";

                    if (
                        snapshot.empty
                    ) {

                        residentContainer
                            .innerHTML =

                            `
                <h4>
                No Residents Found
                </h4>
                `;

                        return;

                    }

                    snapshot.forEach(

                        (resident) => {

                            const data =
                                resident.data();

                            const status =
                                data.status ||
                                STATUS_PENDING;

                            const card =

                                document
                                    .createElement(
                                        "div"
                                    );

                            card.className =
                                "card resident-card p-3 mb-3";

                            card.innerHTML = `

<div class="
d-flex
justify-content-between
align-items-start
gap-3">

<div class="info-section">

<h5>

${data.name || "No Name"}

</h5>

<p>

<b>Flat:</b>

${data.flat || "-"}

|

<b>Floor:</b>

${data.floor || "-"}

</p>

<p>

<b>Apartment:</b>

${data.apartment || "-"}

</p>

<p>

<b>Phone:</b>

${data.phone || "-"}

</p>

<p>

<b>Email:</b>

${data.email || "-"}

</p>

<p>

${getStatusBadge(
                                status
                            )}

</p>

${status === STATUS_PENDING

                                    ?

                                    `

<button

class="
btn btn-success
btn-sm me-2"

onclick="

changeResidentStatus(

'${resident.id}',

'${STATUS_APPROVED}',

'${data.name}'

)

">

Approve

</button>

<button

class="
btn btn-danger
btn-sm"

onclick="

changeResidentStatus(

'${resident.id}',

'${STATUS_REJECTED}',

'${data.name}'

)

">

Reject

</button>

`

                                    :

                                    ""

                                }

</div>

<div class="image-section">

<img

class="profile-image"

src="${data.profileImage ||

                                'https://via.placeholder.com/100'

                                }"

onerror="

this.src='https://via.placeholder.com/100'

"

>

</div>

</div>

`;

                            residentContainer
                                .appendChild(
                                    card
                                );

                        }

                    );

                },

                (err) => {

                    console.log(err);

                    residentContainer
                        .innerHTML =

                        "Error loading residents";

                }

            );

        }

        loadResidents();

    </script>
    <script type="module" src="/script.js"></script>

</body>

</html>

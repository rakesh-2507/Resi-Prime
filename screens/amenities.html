<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amenities</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/auth-guard.js"></script>
    
    <style>
        .amenity-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .amenity-images {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-top: 10px;
        }

        .amenity-images img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .preview-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
    </style>
</head>

<body style="background: #f4f7fe">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none; color: inherit">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard.html">
                    <i class="fa-solid fa-home"></i>
                    Home
                </a>
            </li>
            <li>
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li>
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li>
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>
        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo" />
            </a>
        </div>
    </aside>

    <main class="main">

        <div class="topbar">
            <h1>Amenities</h1>

            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>
        </div>

        <!-- ADD FORM -->

        <div class="card p-4 mb-4">

            <h4 class="mb-3">Add Amenity</h4>

            <input id="amenityName" class="form-control mb-3" placeholder="Amenity Name">

            <textarea id="amenityDescription" class="form-control mb-3" rows="3" placeholder="Description"></textarea>

            <input id="amenityImages" class="form-control mb-3" type="file" multiple accept="image/*">

            <div id="previewContainer" class="d-flex flex-wrap gap-2 mb-3">
            </div>

            <button class="btn btn-primary" onclick="uploadAmenity()">

                Submit Amenity

            </button>

        </div>

        <div class="modal fade" id="editAmenityModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5>Edit Amenity</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <input id="editName" class="form-control mb-3" placeholder="Name">

                        <textarea id="editDescription" class="form-control mb-3" rows="3"
                            placeholder="Description"></textarea>

                        <div id="existingImages" class="d-flex flex-wrap gap-2 mb-3">
                        </div>

                        <input id="editImages" class="form-control" type="file" multiple>

                        <div id="newImagesPreview" class="d-flex flex-wrap gap-2 mt-3">
                        </div>

                    </div>

                    <div class="modal-footer">

                        <button class="btn btn-secondary" data-bs-dismiss="modal">

                            Cancel

                        </button>

                        <button class="btn btn-primary" id="saveEditBtn">

                            Save

                        </button>

                    </div>

                </div>
            </div>
        </div>

        <div id="amenitiesContainer" class="card_container">

            Loading...

        </div>

    </main>
    <script type="module">

        import { db, storage, auth }
            from "/firebase-config.js";

        import {
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            orderBy,
            onSnapshot,
            Timestamp
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        import {
            ref,
            uploadBytes,
            getDownloadURL,
            deleteObject
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

        const imageInput =
            document.getElementById("amenityImages");

        const previewContainer =
            document.getElementById("previewContainer");

        const amenitiesContainer =
            document.getElementById("amenitiesContainer");

        const nameInput =
            document.getElementById("amenityName");

        const descInput =
            document.getElementById("amenityDescription");

        let editDocId = null;
        let existingImages = [];



        /* PREVIEW */

        imageInput.addEventListener(
            "change",
            () => {

                previewContainer.innerHTML = "";

                [...imageInput.files]

                    .forEach(file => {

                        const img =
                            document.createElement("img");

                        img.src =
                            URL.createObjectURL(file);

                        img.className =
                            "preview-img";

                        previewContainer.appendChild(img);

                    });

            });



        /* ADD */

        window.uploadAmenity =
            async () => {

                const user =
                    auth.currentUser;

                if (!user)
                    return alert("Login Required");

                const amenityRef =
                    await addDoc(

                        collection(
                            db,
                            "amenities"
                        ),

                        {
                            name:
                                nameInput.value.trim(),

                            description:
                                descInput.value.trim(),

                            createdBy:
                                user.uid,

                            createdAt:
                                Timestamp.now(),

                            images: []
                        }

                    );

                const urls = [];

                for (

                    let i = 0;

                    i < imageInput.files.length;

                    i++

                ) {

                    const file =
                        imageInput.files[i];

                    const storageRef =
                        ref(

                            storage,

                            `amenities/${amenityRef.id}/image_${i}.jpg`

                        );

                    await uploadBytes(
                        storageRef,
                        file
                    );

                    urls.push(

                        await getDownloadURL(
                            storageRef
                        )

                    );

                }

                await updateDoc(

                    doc(
                        db,
                        "amenities",
                        amenityRef.id
                    ),

                    {
                        images: urls
                    }

                );

                nameInput.value = "";
                descInput.value = "";
                imageInput.value = "";
                previewContainer.innerHTML = "";

            };



        /* LOAD */

        function loadAmenities() {

            const q =
                query(

                    collection(
                        db,
                        "amenities"
                    ),

                    orderBy(
                        "createdAt",
                        "desc"
                    )

                );

            onSnapshot(

                q,

                (snapshot) => {

                    amenitiesContainer.innerHTML = "";

                    snapshot.forEach(

                        (docSnap) => {

                            const data =
                                docSnap.data();

                            const images =

                                (data.images || [])

                                    .map(

                                        img =>

                                            `<img
src="${img}"
class="preview-img">`

                                    )

                                    .join("");

                            const card =
                                document.createElement(
                                    "div"
                                );

                            card.className =
                                "amenity-card mb-3";

                            card.innerHTML = `

<div class="d-flex justify-content-between">

<div>

<h5>
${data.name}
</h5>

<p>
${data.description}
</p>

<div class="amenity-images">

${images}

</div>

</div>

<div class="action-btns">

<button
class="btn btn-primary editBtn">

Edit

</button>

<button
class="btn btn-danger deleteBtn">

Delete

</button>

</div>

</div>

`;

                            card

                                .querySelector(
                                    ".deleteBtn"
                                )

                                .onclick = () =>

                                    deleteAmenity(

                                        docSnap.id,

                                        data.images || []

                                    );

                            card

                                .querySelector(
                                    ".editBtn"
                                )

                                .onclick = () =>

                                    openEdit(

                                        docSnap.id,

                                        data

                                    );

                            amenitiesContainer
                                .appendChild(card);

                        });

                }

            );

        }



        /* EDIT */

        window.openEdit = (

            docId,

            data

        ) => {

            editDocId =
                docId;

            existingImages =
                [...(data.images || [])];

            document.getElementById(
                "editName"
            ).value = data.name;

            document.getElementById(
                "editDescription"
            ).value = data.description;

            renderExisting();

            new bootstrap.Modal(

                document.getElementById(
                    "editAmenityModal"
                )

            ).show();

        };



        function renderExisting() {

            const container =

                document.getElementById(
                    "existingImages"
                );

            container.innerHTML = "";

            existingImages

                .forEach(

                    (img, index) => {

                        container.innerHTML += `

<div class="position-relative">

<img
src="${img}"
class="preview-img">

<button

class="btn btn-danger btn-sm position-absolute top-0 end-0"

onclick="removeExisting(${index})">

×

</button>

</div>

`;

                    }

                );

        }



        window.removeExisting =
            (index) => {

                existingImages.splice(
                    index,
                    1
                );

                renderExisting();

            };



        document

            .getElementById(
                "saveEditBtn"
            )

            .onclick = async () => {

                const files =

                    document.getElementById(
                        "editImages"
                    ).files;

                for (

                    let i = 0;

                    i < files.length;

                    i++

                ) {

                    const storageRef =
                        ref(

                            storage,

                            `amenities/${editDocId}/new_${Date.now()}_${i}`

                        );

                    await uploadBytes(
                        storageRef,
                        files[i]
                    );

                    existingImages.push(

                        await getDownloadURL(
                            storageRef
                        )

                    );

                }

                await updateDoc(

                    doc(
                        db,
                        "amenities",
                        editDocId
                    ),

                    {

                        name:

                            document
                                .getElementById(
                                    "editName"
                                ).value,

                        description:

                            document
                                .getElementById(
                                    "editDescription"
                                ).value,

                        images:
                            existingImages

                    }

                );

                bootstrap.Modal

                    .getInstance(

                        document.getElementById(
                            "editAmenityModal"
                        )

                    )

                    .hide();

            };



        /* DELETE */

        window.deleteAmenity =
            async (
                docId,
                images
            ) => {

                if (
                    !confirm(
                        "Delete?"
                    )
                ) return;

                for (

                    const img of images

                ) {

                    try {

                        const path =

                            decodeURIComponent(

                                img.split("/o/")[1]

                                    .split("?")[0]

                            );

                        await deleteObject(

                            ref(
                                storage,
                                path
                            )

                        );

                    }

                    catch { }

                }

                await deleteDoc(

                    doc(
                        db,
                        "amenities",
                        docId
                    )

                );

            };



        loadAmenities();

    </script>
    <script type="module" src="/script.js"></script>

</body>

</html>

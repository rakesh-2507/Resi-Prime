<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/auth-guard.js"></script>
    <style>
        .notice-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
    </style>
</head>

<body style="background: #f4f7fe">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none; color: inherit">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard.html">
                    <i class="fa-solid fa-home"></i>
                    Home
                </a>
            </li>
            <li>
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li>
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li>
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo" />
            </a>
        </div>
    </aside>
    <main class="main">

        <div class="topbar">
            <h1>Notices</h1>

            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>
        </div>

        <ul class="nav nav-tabs mb-4" id="noticeTabs">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#createTab">
                    Add Notice
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#historyTab">
                    History
                </button>
            </li>
        </ul>

        <div class="tab-content">

            <!-- CREATE -->

            <div class="tab-pane fade show active" id="createTab">

                <div class="notice-card">

                    <form id="noticeForm">

                        <input class="form-control mb-3" id="title" placeholder="Title">

                        <select class="form-select mb-3" id="type">

                            <option>General</option>
                            <option>Emergency</option>
                            <option>Event</option>
                            <option>Maintenance</option>
                            <option>Meeting</option>
                            <option>Security</option>

                        </select>

                        <textarea class="form-control mb-3" id="description" rows="4"
                            placeholder="Description"></textarea>

                        <select class="form-select mb-3" id="priority">

                            <option>Low</option>
                            <option>Medium</option>
                            <option>High</option>
                            <option>Critical</option>

                        </select>

                        <select class="form-select mb-3" id="targetType">

                            <option>All</option>
                            <option>Apartment</option>
                            <option>Wing</option>
                            <option>Flat</option>
                            <option>Role</option>

                        </select>

                        <select id="targetValue" class="form-select mb-3 d-none">
                        </select>

                        <input type="date" class="form-control mb-3" id="expiryDate">

                        <input type="file" id="imagePicker" class="form-control mb-3" accept="image/*">

                        <img id="preview" class="img-fluid rounded mb-3 d-none" style="max-height:200px">

                        <div class="form-check form-switch mb-3">

                            <input class="form-check-input" id="isPinned" type="checkbox">

                            <label class="form-check-label">
                                Pin Notice
                            </label>

                        </div>

                        <button class="btn btn-primary w-100">
                            Save Notice
                        </button>

                    </form>

                </div>

            </div>


            <!-- HISTORY -->

            <div class="tab-pane fade" id="historyTab">

                <div id="historyContainer">

                    Loading...

                </div>

            </div>

        </div>

        <div class="modal fade" id="readDetailsModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">
                            Notice Read Details
                        </h5>

                        <button class="btn-close" data-bs-dismiss="modal">
                        </button>
                    </div>

                    <div class="modal-body">

                        <div id="readUsersContainer">

                            Loading...

                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>
    <script type="module">

        import { db, auth, storage } from "/firebase-config.js";

        import {
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            getDoc,
            getDocs,
            query,
            orderBy,
            onSnapshot,
            Timestamp
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        import {
            ref,
            uploadBytes,
            getDownloadURL,
            deleteObject
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

        const noticeForm =
            document.getElementById("noticeForm");

        const historyContainer =
            document.getElementById("historyContainer");

        const targetType =
            document.getElementById("targetType");

        const targetValue =
            document.getElementById("targetValue");

        const imagePicker =
            document.getElementById("imagePicker");

        const preview =
            document.getElementById("preview");

        const readUsersContainer =
            document.getElementById(
                "readUsersContainer"
            );

        let editingId = null;
        let selectedImage = null;
        let targetData = {};


        // ---------------- LOAD TARGET DATA ----------------

        async function loadTargetData() {

            try {

                const snap =
                    await getDocs(
                        collection(
                            db,
                            "users"
                        )
                    );

                const apartments = new Set();
                const wings = new Set();
                const flats = new Set();
                const roles = new Set();

                snap.forEach((docSnap) => {

                    const d =
                        docSnap.data();

                    if (d.apartment)
                        apartments.add(
                            d.apartment
                        );

                    if (d.floor)
                        wings.add(
                            d.floor
                        );

                    if (d.flat)
                        flats.add(
                            d.flat
                        );

                    if (d.role)
                        roles.add(
                            d.role
                        );

                });

                targetData = {

                    Apartment:
                        [...apartments],

                    Wing:
                        [...wings],

                    Flat:
                        [...flats],

                    Role:
                        [...roles]

                };

            }

            catch (e) {

                console.log(e);

            }

        }

        loadTargetData();


        // ---------------- TARGET DROPDOWN ----------------

        targetType.addEventListener(

            "change",

            () => {

                targetValue.innerHTML =
                    "";

                if (
                    targetType.value ===
                    "All"
                ) {

                    targetValue.classList.add(
                        "d-none"
                    );

                    return;

                }

                targetValue.classList.remove(
                    "d-none"
                );

                (
                    targetData[
                    targetType.value
                    ] || []
                ).forEach((item) => {

                    targetValue.innerHTML += `

            <option value="${item}">
                ${item}
            </option>

            `;

                });

            }

        );


        // ---------------- IMAGE ----------------

        imagePicker.addEventListener(

            "change",

            (e) => {

                selectedImage =
                    e.target.files[0];

                if (!selectedImage)
                    return;

                preview.src =
                    URL.createObjectURL(
                        selectedImage
                    );

                preview.classList.remove(
                    "d-none"
                );

            }

        );

        async function uploadImage() {

            if (!selectedImage)
                return null;

            const storagePath =
                `notices/${Date.now()}.jpg`;

            const fileRef =
                ref(
                    storage,
                    storagePath
                );

            await uploadBytes(
                fileRef,
                selectedImage
            );

            return {

                imageUrl:
                    await getDownloadURL(
                        fileRef
                    ),

                storagePath

            };

        }


        // ---------------- SAVE ----------------

        noticeForm.addEventListener(

            "submit",

            async (e) => {

                e.preventDefault();

                try {

                    let uploadData =
                        null;

                    if (
                        selectedImage
                    ) {

                        uploadData =
                            await uploadImage();

                    }

                    const payload = {

                        title:
                            title.value.trim(),

                        description:
                            description.value.trim(),

                        type:
                            type.value,

                        priority:
                            priority.value,

                        expiryDate:

                            expiryDate.value

                                ? Timestamp.fromDate(
                                    new Date(
                                        expiryDate.value
                                    )
                                )

                                : null,

                        isPinned:
                            isPinned.checked,

                        target: {

                            type:
                                targetType.value
                                    .toLowerCase(),

                            value:

                                targetType.value === "All"

                                    ? "All"

                                    : targetValue.value

                        }

                    };

                    if (
                        uploadData
                    ) {

                        payload.imageUrl =
                            uploadData.imageUrl;

                        payload.storagePath =
                            uploadData.storagePath;

                    }

                    if (
                        editingId
                    ) {

                        await updateDoc(

                            doc(
                                db,
                                "notices",
                                editingId
                            ),

                            payload

                        );

                        editingId =
                            null;

                        alert(
                            "Updated"
                        );

                    }

                    else {

                        payload.createdAt =
                            Timestamp.now();

                        payload.createdBy =
                            auth.currentUser.uid;

                        payload.readBy =
                            [];

                        await addDoc(

                            collection(
                                db,
                                "notices"
                            ),

                            payload

                        );

                        alert(
                            "Created"
                        );

                    }

                    noticeForm.reset();

                    selectedImage =
                        null;

                    preview.classList.add(
                        "d-none"
                    );

                }

                catch (e) {

                    console.log(e);

                    alert(
                        e.message
                    );

                }

            }

        );


        // ---------------- HISTORY ----------------

        onSnapshot(

            query(

                collection(
                    db,
                    "notices"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                )

            ),

            (snapshot) => {

                historyContainer.innerHTML =
                    "";

                snapshot.forEach(
                    (docSnap) => {

                        const d =
                            docSnap.data();

                        historyContainer.innerHTML += `

                <div class="notice-card mb-3">

                    <div
                    style="cursor:pointer"
                    onclick="showReadDetails(
                    ${JSON.stringify(
                            d.readBy || []
                        ).replace(/"/g, '&quot;')}
                    )">

                        <h5>
                        ${d.title}
                        </h5>

                        <p>
                        ${d.type}
                        •
                        ${d.priority}
                        </p>

                        <p class="text-success">

                        Read:
                        ${(d.readBy || []).length}

                        </p>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                        class="btn btn-primary btn-sm"
                        onclick="editNotice('${docSnap.id}')">

                        Edit

                        </button>

                        <button
                        class="btn btn-danger btn-sm"
                        onclick="removeNotice(
                        '${docSnap.id}',
                        '${d.storagePath || ""}'
                        )">

                        Delete

                        </button>

                    </div>

                </div>

                `;

                    }
                );

            }

        );


        // ---------------- READ DETAILS ----------------

        window.showReadDetails =
            async (readBy) => {

                readUsersContainer.innerHTML =
                    "Loading...";

                const usersSnap =
                    await getDocs(
                        collection(
                            db,
                            "users"
                        )
                    );

                let html = "";

                usersSnap.forEach(
                    (userDoc) => {

                        const user =
                            userDoc.data();

                        const hasRead =
                            readBy.includes(
                                userDoc.id
                            );

                        html += `

            <div class="
            border-bottom
            py-2
            d-flex
            justify-content-between">

                <div>

                    <strong>
                    ${user.name || ""}
                    </strong>

                    <br>

                    <small>
                    ${user.flat || ""}
                    </small>

                </div>

                <span class="
                badge
                ${hasRead
                                ? "bg-success"
                                : "bg-danger"}">

                ${hasRead
                                ? "Read"
                                : "Not Read"}

                </span>

            </div>

            `;

                    }
                );

                readUsersContainer.innerHTML =
                    html;

                new bootstrap.Modal(

                    document.getElementById(
                        "readDetailsModal"
                    )

                ).show();

            };


        // ---------------- DELETE ----------------

        window.removeNotice =
            async (id, storagePath) => {

                await deleteDoc(
                    doc(
                        db,
                        "notices",
                        id
                    )
                );

                if (
                    storagePath
                ) {

                    await deleteObject(

                        ref(
                            storage,
                            storagePath
                        )

                    );

                }

            };


        // ---------------- EDIT ----------------

        window.editNotice =
            async (id) => {

                const snap =
                    await getDoc(
                        doc(
                            db,
                            "notices",
                            id
                        )
                    );

                const data =
                    snap.data();

                editingId =
                    id;

                title.value =
                    data.title;

                description.value =
                    data.description;

                type.value =
                    data.type;

                priority.value =
                    data.priority;

                isPinned.checked =
                    data.isPinned;

            };

    </script>
    <script type="module" src="/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/auth-guard.js"></script>
    <style>
        .gallery-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
    </style>
</head>

<body style="background: #f4f7fe">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none; color: inherit">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard.html">
                    <i class="fa-solid fa-home"></i>
                    Home
                </a>
            </li>
            <li>
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li>
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li>
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li class="active">
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo" />
            </a>
        </div>
    </aside>

    <main class="main">

        <div class="topbar">
            <h1>Gallery</h1>
            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>
        </div>
        <div class="card p-4 mb-4">

            <h4>Add Event</h4>

            <input id="eventName" class="form-control mb-3" placeholder="Event Name">

            <div class="row mb-3">
                <div class="col">
                    <input id="eventDate" type="date" class="form-control">
                </div>

                <div class="col">
                    <input id="eventTime" type="time" class="form-control">
                </div>
            </div>

            <input type="file" id="eventImages" multiple accept="image/*" class="form-control mb-3">

            <div id="previewContainer" class="d-flex gap-2 flex-wrap mb-3"></div>

            <button class="btn btn-primary" onclick="uploadEvent()">

                Upload Event

            </button>

        </div>
        <div id="galleryContainer" class="card_container">

            Loading...

        </div>
    </main>
    <script type="module">

        import { db, storage, auth } from "/firebase-config.js";

        import {
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            orderBy,
            onSnapshot,
            Timestamp
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        import {
            ref,
            uploadBytes,
            getDownloadURL,
            deleteObject
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";


        const eventName = document.getElementById("eventName");
        const eventDate = document.getElementById("eventDate");
        const eventTime = document.getElementById("eventTime");
        const eventImages = document.getElementById("eventImages");

        const previewContainer =
            document.getElementById("previewContainer");

        const galleryContainer =
            document.getElementById("galleryContainer");

        let editingId = null;
        let existingImages = [];


        /* ---------------- IMAGE PREVIEW ---------------- */

        eventImages.addEventListener(
            "change",
            () => {

                previewContainer.innerHTML = "";

                [...eventImages.files].forEach(file => {

                    const img = document.createElement("img");

                    img.src =
                        URL.createObjectURL(file);

                    img.style.width = "100px";
                    img.style.height = "100px";
                    img.style.objectFit = "cover";

                    previewContainer.appendChild(img);

                });

            });


        /* ---------------- UPLOAD / UPDATE ---------------- */

        window.uploadEvent =
            async () => {

                if (
                    !eventName.value.trim()
                ) {

                    alert("Enter event name");

                    return;

                }

                try {

                    const user =
                        auth.currentUser;

                    if (!user) {

                        alert("Login required");

                        return;

                    }

                    let uploaded = [];

                    for (
                        let i = 0;
                        i < eventImages.files.length;
                        i++
                    ) {

                        const file =
                            eventImages.files[i];

                        const storageRef =
                            ref(

                                storage,

                                `events/${Date.now()}_${i}`

                            );

                        await uploadBytes(
                            storageRef,
                            file
                        );

                        uploaded.push(

                            await getDownloadURL(
                                storageRef
                            )

                        );

                    }

                    const payload = {

                        name:
                            eventName.value.trim(),

                        date:
                            eventDate.value
                                ? Timestamp.fromDate(
                                    new Date(eventDate.value)
                                )
                                : null,

                        time:
                            eventTime.value || null,

                        images: [
                            ...existingImages,
                            ...uploaded
                        ],

                        createdBy:
                            user.uid,

                        createdAt:
                            Timestamp.now()

                    };

                    if (editingId) {

                        await updateDoc(

                            doc(
                                db,
                                "events",
                                editingId
                            ),

                            payload

                        );

                        alert("Updated");

                    } else {

                        await addDoc(

                            collection(
                                db,
                                "events"
                            ),

                            payload

                        );

                        alert("Added");

                    }

                    resetForm();

                } catch (err) {

                    console.log(err);

                    alert(err.message);

                }

            };


        /* ---------------- LOAD EVENTS ---------------- */

        function loadEvents() {

            const q = query(

                collection(
                    db,
                    "events"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                )

            );

            onSnapshot(

                q,

                (snapshot) => {

                    galleryContainer.innerHTML = "";

                    if (snapshot.empty) {

                        galleryContainer.innerHTML =
                            "No Events";

                        return;

                    }

                    snapshot.forEach(docSnap => {

                        const data =
                            docSnap.data();

                        const imagesHTML =

                            (data.images || [])

                                .map(

                                    img => `

<div style="position:relative">

<img
src="${img}"
style="
width:100px;
height:100px;
object-fit:cover">

</div>

`

                                )

                                .join("");

                        const card =
                            document.createElement("div");

                        card.className =
                            "gallery-card mb-3";

                        card.innerHTML = `

<h4>

${data.name || ""}

</h4>

<p>

${data.date?.toDate
                                ? data.date.toDate()
                                    .toLocaleDateString()
                                : ""}

</p>

<p>

${data.time || ""}

</p>

<div
class="d-flex gap-2 flex-wrap mb-3">

${imagesHTML}

</div>

<div class="d-flex gap-2">

<button
class="
btn btn-primary btn-sm edit-btn">

Edit

</button>

<button
class="
btn btn-danger btn-sm delete-btn">

Delete

</button>

</div>

`;

                        card.querySelector(
                            ".edit-btn"
                        )

                            .onclick = () => {

                                editingId =
                                    docSnap.id;

                                existingImages =
                                    data.images || [];

                                eventName.value =
                                    data.name || "";

                                eventDate.value =
                                    data.date
                                        ? data.date.toDate()
                                            .toISOString()
                                            .split("T")[0]
                                        : "";

                                eventTime.value =
                                    data.time || "";

                                previewContainer.innerHTML = "";

                                existingImages.forEach(url => {

                                    const wrapper =
                                        document.createElement("div");

                                    wrapper.innerHTML = `

<div style="
position:relative">

<img
src="${url}"
style="
width:100px;
height:100px">

<button
style="
position:absolute;
top:0;
right:0"

class="
btn btn-danger btn-sm">

×

</button>

</div>

`;

                                    wrapper
                                        .querySelector("button")

                                        .onclick = () => {

                                            existingImages =
                                                existingImages.filter(

                                                    i => i !== url

                                                );

                                            wrapper.remove();

                                        };

                                    previewContainer
                                        .appendChild(wrapper);

                                });

                                window.scrollTo({
                                    top: 0,
                                    behavior: "smooth"
                                });

                            };

                        card.querySelector(
                            ".delete-btn"
                        )

                            .onclick = () => {

                                deleteEvent(
                                    docSnap.id,
                                    data.images || []
                                );

                            };

                        galleryContainer
                            .appendChild(card);

                    });

                }

            );

        }


        /* ---------------- DELETE ---------------- */

        window.deleteEvent =
            async (
                id,
                images
            ) => {

                if (
                    !confirm(
                        "Delete event?"
                    )
                ) return;

                try {

                    for (
                        const url of images
                    ) {

                        try {

                            const path =

                                decodeURIComponent(

                                    url
                                        .split("/o/")[1]
                                        .split("?")[0]

                                );

                            await deleteObject(

                                ref(
                                    storage,
                                    path
                                )

                            );

                        } catch { }

                    }

                    await deleteDoc(

                        doc(
                            db,
                            "events",
                            id
                        )

                    );

                    alert("Deleted");

                } catch (err) {

                    alert(err.message);

                }

            };


        /* ---------------- RESET ---------------- */

        function resetForm() {

            editingId = null;

            existingImages = [];

            eventName.value = "";
            eventDate.value = "";
            eventTime.value = "";
            eventImages.value = "";

            previewContainer.innerHTML = "";

        }


        loadEvents();

    </script>
    <script type="module" src="/script.js"></script>

</body>

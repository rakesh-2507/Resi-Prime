<!doctype html>
<html>

<head>
    <title>Complaint Management</title>

    <style>
        .analytics {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: white;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .stat {
            cursor: pointer;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }

        .selected {
            background: #ddd;
        }

        .images img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
            margin-right: 5px;
        }

        button {
            padding: 8px 12px;
            border: none;
            color: white;
            cursor: pointer;
            margin: 4px;
            border-radius: 5px;
        }

        .orange {
            background: orange;
        }

        .blue {
            background: royalblue;
        }

        .green {
            background: green;
        }

        .hidden {
            display: none;
        }

        .c_card {
            background: #fff;
            padding: 24px;
            border-radius: 22px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: #111827;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 350px;
            margin: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card_container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background: #e74c3c;
        }

        .status-progress {
            background: #3498db;
        }

        .status-resolved {
            background: #27ae60;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
</head>

<body style="background: #f4f7fe">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none; color: inherit">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">
            <li class="active">
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li>
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li>
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/screens/maintenance.html">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Maintenance
                </a>
            </li>

            <li>
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>
        </ul>

        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo" />
            </a>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>Complaints Management</h1>

            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>
        </div>

        <div id="complaintContainer" class="card_container">Loading...</div>
    </main>

    <script type="module">
        import { db } from "/firebase-config.js";

        import {
            collection,
            query,
            orderBy,
            onSnapshot,
            doc,
            getDoc,
            getDocs,
            updateDoc,
            where,
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const complaintContainer = document.getElementById("complaintContainer");

        async function updateComplaint(id, data) {
            try {
                await updateDoc(
                    doc(db, "complaints", id),

                    {
                        ...data,
                        updatedAt: new Date(),
                    },
                );
            } catch (err) {
                console.log(err);

                alert("Failed updating complaint");
            }
        }

        async function getStaffOptions() {
            let options = `<option value="">
            Select Staff
        </option>`;

            try {
                const staffSnap = await getDocs(
                    query(
                        collection(db, "staff"),

                        where("isActive", "==", true),
                    ),
                );

                staffSnap.forEach((staff) => {
                    options += `

            <option value="${staff.id}">

                ${staff.data().name}

            </option>

            `;
                });
            } catch (err) {
                console.log(err);
            }

            return options;
        }

        async function loadComplaints() {
            const staffOptions = await getStaffOptions();

            const complaintQuery = query(
                collection(db, "complaints"),

                orderBy("createdAt", "desc"),
            );

            onSnapshot(
                complaintQuery,

                async (snapshot) => {
                    complaintContainer.innerHTML = "";

                    if (snapshot.empty) {
                        complaintContainer.innerHTML = `
                    <h3>
                    No complaints found
                    </h3>
                    `;

                        return;
                    }

                    for (const complaintDoc of snapshot.docs) {
                        const complaint = complaintDoc.data();

                        let resident = {};

                        try {
                            const residentDoc = await getDoc(
                                doc(
                                    db,

                                    "users",

                                    complaint.residentId,
                                ),
                            );

                            resident = residentDoc.data() || {};
                        } catch (e) {
                            console.log(e);
                        }

                        const card = document.createElement("div");

                        card.className = "c_card";

                        const imageHTML = complaint.images?.length
                            ? complaint.images
                                .map(
                                    (img) =>
                                        `
                            <img
                            src="${img}"

                            onclick="
                            window.open(
                            '${img}'
                            )
                            ">
                        `,
                                )

                                .join("")
                            : "No Images";

                        card.innerHTML = `
            <div class="card-head d-flex justify-content-between">
                <h3>

                    ${complaint.type}

                </h3>

                <p>                                
                    <span class="status 
                    ${complaint.status === "Pending"
                                ? "status-pending"
                                : complaint.status === "In Progress"
                                    ? "status-progress"
                                    : "status-resolved"
                            }">
                                
                    ${complaint.status}
                                
                    </span>
                </p>
            </div>
                <p>

                    <b>Resident:</b>

                    ${resident.name || "Unknown"}

                </p>

                <p>

                    <b>Flat:</b>

                    ${resident.flat || "-"}

                </p>

                <p>

                    ${complaint.description}

                </p>

                <div class="images">

                    ${imageHTML}

                </div>

                <p>

                    <b>
                    Assigned:
                    </b>

                    ${complaint.assignedStaffName || "Not Assigned"}

                </p>

                <select
                id="staff-${complaintDoc.id}">

                    ${staffOptions}

                </select>

                <button
                class="blue"

                data-id="${complaintDoc.id}"

                onclick="
                assignStaff(
                '${complaintDoc.id}'
                )
                ">

                Assign Staff

                </button>

                <br><br>

                <button

                class="orange"

                onclick="
                changeStatus(
                '${complaintDoc.id}',
                'Pending'
                )
                ">

                Pending

                </button>

                <button

                class="blue"

                onclick="
                changeStatus(
                '${complaintDoc.id}',
                'In Progress'
                )
                ">

                In Progress

                </button>

                <button

                class="green"

                onclick="
                changeStatus(
                '${complaintDoc.id}',
                'Resolved'
                )
                ">

                Resolved

                </button>

                `;

                        complaintContainer.appendChild(card);
                    }
                },

                (error) => {
                    console.log(error);

                    complaintContainer.innerHTML = `
                Error loading complaints
                `;
                },
            );
        }

        window.assignStaff = async function (id) {
            const staffId = document.getElementById(`staff-${id}`).value;

            if (!staffId) {
                alert("Select staff");

                return;
            }

            const staffDoc = await getDoc(doc(db, "staff", staffId));

            await updateComplaint(
                id,

                {
                    assignedStaffId: staffId,

                    assignedStaffName: staffDoc.data().name,

                    status: "In Progress",
                },
            );

            alert("Staff Assigned");
        };

        window.changeStatus = function (id, status) {
            updateComplaint(
                id,

                {
                    status,
                },
            );
        };

        loadComplaints();
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>RESI_PRIME</title>

    <style>
        .user-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            color: white;
            margin-left: 8px;
        }

        .approve {
            background: green;
        }

        .reject {
            background: red;
        }

        .empty {
            text-align: center;
            margin-top: 50px;
            color: gray;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css">
</head>

<body style="background:#f4f7fe;">
    <button class="menu-toggle" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>


    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <a href="/dashboard.html" style="text-decoration: none;color: inherit;">
                <i class="fa-solid fa-building"></i>
                Admin Panel
            </a>
        </div>

        <ul class="menu">

            <li>
                <a href="/screens/complaints.html">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Complaints
                </a>
            </li>

            <li>
                <a href="/screens/residents.html">
                    <i class="fa-solid fa-users"></i>
                    Residents
                </a>
            </li>

            <li>
                <a href="/screens/staff.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Staff
                </a>
            </li>

            <li>
                <a href="/screens/bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/screens/maintenance.html">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Maintenance
                </a>
            </li>

            <li>
                <a href="/screens/gallery.html">
                    <i class="fa-solid fa-image"></i>
                    Gallery
                </a>
            </li>

            <li>
                <a href="/screens/profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

        <div class="d-flex justify-content-center">
            <a href="/dashboard.html" style="display: contents;">
                <img src="/assets/web_logo_white.png" width="50%" alt="Resi_Prime Logo">
            </a>
        </div>


    </aside>

    <main class="main">
        <div class="topbar">

            <h1>Pending Approvals</h1>

            <div class="admin">
                <i class="fa-solid fa-user"></i>
                Administrator
            </div>

        </div>
        <div id="usersContainer">
            No Pending Approvals
        </div>
    </main>
    <script type="module">

        import { db } from "/firebase-config.js";

        import {
            collection,
            query,
            where,
            onSnapshot,
            doc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const statusPending = "pending";
        const statusApproved = "approved";
        const statusRejected = "rejected";

        const container = document.getElementById("usersContainer");

        async function updateStatus(userId, status) {

            try {

                await updateDoc(
                    doc(db, "users", userId),
                    {
                        status: status
                    }
                );

                alert(`User ${status} successfully`);

            } catch (err) {

                console.error(err);

                alert(err.message);

            }

        }

        window.confirmAction = function (userId, status, name) {

            const ok = confirm(
                `Are you sure you want to ${status} ${name}?`
            );

            if (ok) {

                updateStatus(
                    userId,
                    status
                );

            }

        };

        const usersQuery = query(

            collection(db, "users"),

            where(
                "status",
                "==",
                statusPending
            ),

            where(
                "role",
                "in",
                ["Resident", "Watchman"]
            )

        );

        onSnapshot(
            usersQuery,
            (snapshot) => {

                container.innerHTML = "";

                if (snapshot.empty) {

                    container.innerHTML = `

            <div class="empty">

                No pending approvals

            </div>

            `;

                    return;

                }

                snapshot.forEach((documentData) => {

                    const user = documentData.data();

                    const photo =

                        user.photo &&
                            user.photo !== ""

                            ? user.photo

                            : "https://via.placeholder.com/55";

                    const card = document.createElement("div");

                    card.className = "user-card";

                    card.innerHTML = `

            <div class="user-info">

                <img class="avatar" src="${photo}">

                <div>

                    <h4>${user.name || "No Name"}</h4>

                    <div>${user.email || ""}</div>

                    <small>${user.role || ""}</small>

                </div>

            </div>

            <div>

                <button 
                    class="btn approve"

                    onclick="confirmAction(
                        '${documentData.id}',
                        '${statusApproved}',
                        '${user.name || ""}'
                    )">

                    Approve

                </button>

                <button 
                    class="btn reject"

                    onclick="confirmAction(
                        '${documentData.id}',
                        '${statusRejected}',
                        '${user.name || ""}'
                    )">

                    Reject

                </button>

            </div>

            `;

                    container.appendChild(card);

                });

            }

        );

    </script>
</body>

</html>

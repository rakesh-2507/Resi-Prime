<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RESI_PRIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #252a34;
            font-size: 28px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .admin-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .admin-card:hover {
            transform: translateY(-4px);
        }

        .top-section {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #61676b;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .details h3 {
            color: #252a34;
            margin-bottom: 4px;
        }

        .details p {
            color: #777;
            font-size: 14px;
        }

        .info {
            margin-bottom: 10px;
        }

        .info span {
            font-weight: 600;
            color: #252a34;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 50px;
            background: #fff4d6;
            color: #d48806;
            font-size: 13px;
            margin-top: 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .approve-btn,
        .reject-btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .approve-btn {
            background: #28a745;
            color: white;
        }

        .approve-btn:hover {
            background: #1f8a38;
        }

        .reject-btn {
            background: #ff4d4f;
            color: white;
        }

        .reject-btn:hover {
            background: #e63946;
        }

        .empty {
            text-align: center;
            margin-top: 100px;
            color: #777;
        }

        .loader {
            text-align: center;
            margin-top: 80px;
            color: #61676b;
            font-size: 18px;
        }
    </style>
    <script type="module" src="/auth-guard.js"></script>

</head>

<body style="display:none;">
    <div class="container">

        <!-- HEADER -->
        <div class="header">

            <h1>
                Pending Admin Approvals
            </h1>

        </div>

        <!-- LOADER -->
        <div class="loader" id="loader">

            Loading pending admins...

        </div>

        <!-- ADMIN LIST -->
        <div class="admin-grid" id="adminGrid"></div>

        <!-- EMPTY -->
        <div class="empty" id="empty" style="display:none;">

            <h2>
                No Pending Admin Requests
            </h2>

        </div>

    </div>

    <script type="module">

        import {
            auth,
            db
        } from './firebase-config.js';

        import {
            collection,
            query,
            where,
            getDocs,
            doc,
            updateDoc,
            deleteDoc
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const adminGrid =
            document.getElementById("adminGrid");

        const loader =
            document.getElementById("loader");

        const empty =
            document.getElementById("empty");

        // LOAD PENDING ADMINS
        async function loadPendingAdmins() {

            try {

                const q =
                    query(
                        collection(db, "users"),
                        where("role", "==", "Admin"),
                        where("status", "==", "pending"),
                        where("emailVerified", "==", true)
                    );

                const querySnapshot =
                    await getDocs(q);

                loader.style.display =
                    "none";

                if (
                    querySnapshot.empty
                ) {

                    empty.style.display =
                        "block";

                    return;
                }

                querySnapshot.forEach((docSnap) => {

                    const data =
                        docSnap.data();

                    const card =
                        document.createElement("div");

                    card.classList.add(
                        "admin-card"
                    );

                    card.innerHTML = `

                        <div class="top-section">

                            <div class="avatar">
                                <i class="fa-solid fa-user"></i>
                            </div>

                            <div class="details">
                                <h3>${data.name}</h3>
                                <p>${data.email}</p>
                            </div>

                        </div>

                        <div class="info">
                            <span>Phone:</span>
                            ${data.phone}
                        </div>

                        <div class="info">
                            <span>Apartment:</span>
                            ${data.apartment}
                        </div>

                        <div class="info">
                            <span>Flat:</span>
                            ${data.flat}
                        </div>

                        <div class="info">
                            <span>Floor:</span>
                            ${data.floor}
                        </div>

                        <div class="status">
                            Pending Approval
                        </div>

                        <div class="btn-group">

                            <button class="approve-btn"
                                data-id="${docSnap.id}">

                                Approve

                            </button>

                            <button class="reject-btn"
                                data-id="${docSnap.id}">

                                Reject

                            </button>

                        </div>

                    `;

                    adminGrid.appendChild(
                        card
                    );

                });

                // APPROVE
                document
                    .querySelectorAll(
                        ".approve-btn"
                    )
                    .forEach((btn) => {

                        btn.addEventListener(
                            "click",
                            async () => {

                                const userId =
                                    btn.dataset.id;

                                await updateDoc(
                                    doc(
                                        db,
                                        "users",
                                        userId
                                    ),
                                    {
                                        status:
                                            "approved"
                                    }
                                );

                                btn.innerText = "Approved";
                                btn.disabled = true;

                                location.reload();

                            }
                        );

                    });

                // REJECT
                document
                    .querySelectorAll(
                        ".reject-btn"
                    )
                    .forEach((btn) => {

                        btn.addEventListener(
                            "click",
                            async () => {

                                const userId =
                                    btn.dataset.id;

                                const confirmDelete =
                                    confirm(
                                        "Reject this admin?"
                                    );

                                if (
                                    !confirmDelete
                                ) return;

                                await deleteDoc(
                                    doc(
                                        db,
                                        "users",
                                        userId
                                    )
                                );

                                btn.innerText = "Approved";
                                btn.disabled = true;

                                location.reload();

                            }
                        );

                    });

            } catch (error) {

                console.log(error);

                loader.innerHTML =
                    "Failed to load admins";

            }

        }

        loadPendingAdmins();

    </script>

</body>

</html>
